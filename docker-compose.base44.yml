services:
  web:
    image: oven/bun:1-debian
    working_dir: /app
    volumes:
      - .:/app
      # keep the container's own node_modules so host/bun version mismatches don't leak
      - web_node_modules:/app/node_modules
    command: sh -c "bun install && bun run dev -- --host 0.0.0.0 --port 3000 --strictPort"
    ports:
      - "3000:3000"
    env_file:
      - ./.env
      - /run/base44/app.env
    environment:
      # Vite >= 6.1 appends this to allowedHosts; the platform sets it to the sandbox domain.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
    restart: unless-stopped

volumes:
  web_node_modules:
